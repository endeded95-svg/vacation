<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Задачи с 4 по 8 мая</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      display: grid;
      place-items: center;
      overflow: hidden;
      font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: white;
      background:
        radial-gradient(circle at 15% 15%, rgba(255, 221, 174, .95), transparent 28%),
        radial-gradient(circle at 85% 20%, rgba(60, 83, 102, .95), transparent 32%),
        radial-gradient(circle at 72% 82%, rgba(147, 97, 255, .7), transparent 28%),
        radial-gradient(circle at 25% 80%, rgba(67, 255, 226, .45), transparent 25%),
        linear-gradient(135deg, #efd8c3 0%, #aab4ba 45%, #121b24 100%);
    }

    body::before {
      content: "";
      position: fixed;
      inset: -40%;
      background:
        conic-gradient(
          from 180deg,
          transparent,
          rgba(112, 255, 236, .18),
          rgba(160, 100, 255, .22),
          rgba(255, 143, 199, .18),
          transparent
        );
      animation: spin 18s linear infinite;
      filter: blur(40px);
      opacity: .85;
    }

    body::after {
      content: "";
      position: fixed;
      inset: 0;
      background-image:
        linear-gradient(rgba(255,255,255,.06) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,.06) 1px, transparent 1px);
      background-size: 42px 42px;
      mask-image: radial-gradient(circle, #000 20%, transparent 72%);
      opacity: .35;
      pointer-events: none;
    }

    .orb {
      position: fixed;
      width: 360px;
      height: 360px;
      border-radius: 999px;
      filter: blur(70px);
      opacity: .72;
      animation: float 9s ease-in-out infinite alternate;
      pointer-events: none;
    }

    .orb.one {
      left: -80px;
      top: 12%;
      background: #ffd7a8;
    }

    .orb.two {
      right: -90px;
      bottom: 6%;
      background: linear-gradient(135deg, #65fff0, #865cff, #ff8fcf);
      animation-delay: -3s;
    }

    .orb.three {
      width: 240px;
      height: 240px;
      left: 55%;
      top: 8%;
      background: #ffffff;
      opacity: .24;
      animation-delay: -6s;
    }

    .shell {
      position: relative;
      z-index: 2;
      width: min(980px, 92vw);
      padding: 36px;
      border-radius: 48px;
      background: rgba(255, 255, 255, .14);
      border: 1px solid rgba(255,255,255,.42);
      box-shadow:
        inset 0 1px 0 rgba(255,255,255,.75),
        inset 0 -30px 80px rgba(255,255,255,.07),
        0 45px 120px rgba(0,0,0,.42);
      backdrop-filter: blur(34px) saturate(190%);
      -webkit-backdrop-filter: blur(34px) saturate(190%);
    }

    .title {
      margin-bottom: 30px;
      font-size: clamp(34px, 6vw, 76px);
      line-height: .92;
      letter-spacing: -0.08em;
      text-shadow: 0 18px 50px rgba(0,0,0,.35);
    }

    .title span {
      background: linear-gradient(90deg, #fff, #d9fff9, #ffd7ef);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(6, 1fr);
      gap: 18px;
    }

    .card {
      position: relative;
      min-height: 150px;
      padding: 22px;
      grid-column: span 2;
      display: flex;
      align-items: flex-end;
      overflow: hidden;
      isolation: isolate;

      text-decoration: none;
      color: white;
      border-radius: 34px;
      background:
        linear-gradient(145deg, rgba(255,255,255,.32), rgba(255,255,255,.08)),
        radial-gradient(circle at 20% 10%, rgba(255,255,255,.75), transparent 25%);
      border: 1px solid rgba(255,255,255,.36);
      box-shadow:
        inset 0 1px 0 rgba(255,255,255,.7),
        inset 0 -18px 48px rgba(255,255,255,.08),
        0 22px 55px rgba(0,0,0,.25);
      backdrop-filter: blur(26px) saturate(200%);
      -webkit-backdrop-filter: blur(26px) saturate(200%);
      transition: .35s ease;
    }

    .card:nth-child(1),
    .card:nth-child(5) {
      grid-column: span 3;
    }

    .card::before {
      content: "";
      position: absolute;
      width: 190px;
      height: 190px;
      right: -65px;
      top: -65px;
      border-radius: 50%;
      background: var(--glow);
      filter: blur(2px);
      opacity: .95;
      z-index: -1;
      transition: .45s ease;
    }

    .card::after {
      content: "";
      position: absolute;
      inset: 0;
      background: linear-gradient(115deg, transparent, rgba(255,255,255,.58), transparent);
      transform: translateX(-130%);
      opacity: .55;
      transition: .8s ease;
    }

    .card:hover {
      transform: translateY(-10px) scale(1.025) rotateX(4deg);
      border-color: rgba(255,255,255,.7);
      box-shadow:
        inset 0 1px 0 rgba(255,255,255,.9),
        0 32px 80px rgba(0,0,0,.34),
        0 0 50px rgba(122,255,236,.22);
    }

    .card:hover::before {
      transform: scale(1.25);
    }

    .card:hover::after {
      transform: translateX(130%);
    }

    .number {
      position: absolute;
      top: 18px;
      left: 20px;
      font-size: 13px;
      font-weight: 800;
      letter-spacing: .08em;
      color: rgba(255,255,255,.68);
    }

    .name {
      position: relative;
      z-index: 2;
      font-size: clamp(28px, 3vw, 42px);
      font-weight: 900;
      letter-spacing: -0.055em;
      text-shadow: 0 14px 34px rgba(0,0,0,.34);
    }

    .icon {
      position: absolute;
      top: 16px;
      right: 18px;
      width: 38px;
      height: 38px;
      display: grid;
      place-items: center;
      border-radius: 50%;
      background: rgba(255,255,255,.25);
      border: 1px solid rgba(255,255,255,.38);
      box-shadow: inset 0 1px 0 rgba(255,255,255,.5);
    }

    .card:nth-child(1) { --glow: linear-gradient(135deg, #8f6cff, #62fff0); }
    .card:nth-child(2) { --glow: linear-gradient(135deg, #ff9ad5, #8f6cff); }
    .card:nth-child(3) { --glow: linear-gradient(135deg, #62fff0, #7d9cff); }
    .card:nth-child(4) { --glow: linear-gradient(135deg, #ffd18c, #ff8fc7); }
    .card:nth-child(5) { --glow: linear-gradient(135deg, #9fffcb, #7b61ff); }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    @keyframes float {
      from { transform: translate3d(0,0,0) scale(1); }
      to { transform: translate3d(45px,-35px,0) scale(1.12); }
    }

    @media (max-width: 720px) {
      .shell {
        padding: 24px;
        border-radius: 34px;
      }

      .grid {
        grid-template-columns: 1fr;
      }

      .card,
      .card:nth-child(1),
      .card:nth-child(5) {
        grid-column: auto;
        min-height: 120px;
      }
    }
  </style>
</head>

<body>
  <div class="orb one"></div>
  <div class="orb two"></div>
  <div class="orb three"></div>

  <main class="shell">
    <h1 class="title"><span>Задачи на Отпуск</span></h1>

    <section class="grid">
      <a class="card" href="https://docs.google.com/spreadsheets/d/1521eQwG0lwha_YP3DfeVby0NITpF4FvY1j5Ig-2dpI4/edit?usp=sharing"><span class="number">01</span><span class="icon">✦</span><span class="name">Маша</span></a>
      <a class="card" href="https://docs.google.com/spreadsheets/d/1521eQwG0lwha_YP3DfeVby0NITpF4FvY1j5Ig-2dpI4/edit?usp=sharing"><span class="number">02</span><span class="icon">✓</span><span class="name">Юля</span></a>
      <a class="card" href="https://docs.google.com/spreadsheets/d/1521eQwG0lwha_YP3DfeVby0NITpF4FvY1j5Ig-2dpI4/edit?usp=sharing"><span class="number">03</span><span class="icon">＋</span><span class="name">Арина</span></a>
      <a class="card" href="https://docs.google.com/spreadsheets/d/1521eQwG0lwha_YP3DfeVby0NITpF4FvY1j5Ig-2dpI4/edit?usp=sharing"><span class="number">04</span><span class="icon">○</span><span class="name">Марина</span></a>
      <a class="card" href="https://docs.google.com/spreadsheets/d/1521eQwG0lwha_YP3DfeVby0NITpF4FvY1j5Ig-2dpI4/edit?usp=sharing"><span class="number">05</span><span class="icon">↗</span><span class="name">Оксана</span></a>
    </section>
  </main>
</body>
</html>
